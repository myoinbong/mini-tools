<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Tools - 웹 유틸리티 도구 모음</title>
  <meta name="description" content="이름 생성기, AI 색상 팔레트 시각화 등 다양한 웹 생산성 도구를 한곳에서 제공하는 정적 웹 유틸리티 모음입니다.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="home.css">
</head>

<body class="dark-theme">
  <!-- 배경 애니메이션 데코레이션 블롭 -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <a href="index.html" class="logo-area" id="logo-link" title="Mini Tools 홈으로 이동">
        <span class="logo-icon">⚡</span>
        <h1>Mini Tools</h1>
        <span class="badge">Suite</span>
      </a>
      <div class="header-actions">
        <nav class="main-nav" id="main-nav" aria-label="메인 네비게이션">
          <a href="index.html" class="nav-item active" id="nav-home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">홈</span>
          </a>
          <a href="name-generator.html" class="nav-item" id="nav-name-generator">
            <span class="nav-icon">🏷️</span>
            <span class="nav-label">이름 생성기</span>
          </a>
          <a href="color-palette.html" class="nav-item" id="nav-color-palette">
            <span class="nav-icon">🎨</span>
            <span class="nav-label">색상 팔레트</span>
          </a>
        </nav>
        <button id="theme-toggle-btn" class="icon-btn" title="테마 변경 (다크/라이트)" aria-label="테마 변경">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-view">
      <!-- Hero Section -->
      <section class="dashboard-hero">
        <div class="hero-badge">
          <span>✦ Utility Suite</span>
        </div>
        <h2 class="hero-title">가볍고 유용한 <span class="gradient-text">웹 유틸리티</span></h2>
        <p class="hero-subtitle">필요한 도구를 선택해 브라우저에서 바로 작업을 시작하세요.</p>
      </section>

      <!-- Tool Cards Grid -->
      <section class="tools-grid">
        <!-- Card 1: Name Generator -->
        <a href="name-generator.html" class="tool-card">
          <div class="tool-card-icon icon-name">🏷️</div>
          <h3 class="tool-card-title">이름 생성기</h3>
          <p class="tool-card-desc">우분투 네이밍 규칙 및 커스텀 프리셋 기반 단어 조합기</p>
          <div class="tool-card-action">
            <span>도구 열기</span>
            <span aria-hidden="true">→</span>
          </div>
        </a>

        <!-- Card 2: Color Palette -->
        <a href="color-palette.html" class="tool-card">
          <div class="tool-card-icon icon-palette">🎨</div>
          <h3 class="tool-card-title">색상 팔레트 (Palette Inspector)</h3>
          <p class="tool-card-desc">자체 하모니 생성, 개별 잠금/편집, 실전 블로그 목업 검수 및 AI 연동</p>
          <div class="tool-card-action">
            <span>도구 열기</span>
            <span aria-hidden="true">→</span>
          </div>
        </a>
      </section>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="common.js"></script>
</body>

</html>
